name: SkillBridge CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://skillbridge:skillbridge_ci@localhost:5432/skillbridge
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      CLIENT_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci || npm install

      - name: Setup Server Database & Generate Prisma Client
        run: |
          cd server
          npm run db:migrate
          npx prisma generate

      - name: Build Server
        run: npm run build --workspace=server

      - name: Build Client
        run: npm run build --workspace=client
